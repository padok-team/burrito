name: Trivy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Scheduled runs always execute on the default branch (main). They follow the
  # same behavior as push events (SARIF report uploaded to the Security tab).
  schedule:
    - cron: "0 8 * * *" # Every day at 08:00 UTC

permissions: {}

jobs:
  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to upload SARIF to the GitHub Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Always generate a SARIF report. On pull requests, GitHub code scanning
      # compares it with main and the "Trivy" check fails only on new HIGH+
      # alerts introduced by the PR, not on pre-existing ones. Keep the default
      # SARIF category, it must match the one used on main for the comparison.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif
