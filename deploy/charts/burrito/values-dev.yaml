config:
  burrito:
    runner:
      image:
        repository: burrito
        tag: DEV_TAG
        pullPolicy: Never
    datastore:
      storage:
        mock: true
    server:
      basicAuth:
        enabled: false
    controller:
      timers:
        driftDetection: 10m
        repositorySync: 2m
global:
  deployment:
    image:
      repository: burrito
      tag: DEV_TAG
      pullPolicy: Never
tenants:
  - namespace:
      create: true
      name: "burrito-project"
      metadata:
        labels: {}
        annotations: {}
    metadata:
      labels: {}
      annotations: {}
