services:
  burritotest-garage:
    image: dxflrs/garage:v2.4.1
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    hostname: garage
    ports:
      - "9000:3900"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: burritoadmin
      GARAGE_DEFAULT_SECRET_KEY: burritoadminsecret
      GARAGE_DEFAULT_BUCKET: test-bucket
    volumes:
      - ./garage.toml:/etc/garage.toml
      - /data # ephemeral storage for testing
    healthcheck: # allows the tests to wait for Garage to be ready (image has no shell/curl, use the garage binary itself)
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  burritotest-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    hostname: azurite
    command:
      - azurite
      - --disableTelemetry
      - --blobHost=0.0.0.0
      - --blobPort=10000
      - --inMemoryPersistence
      - --extentMemoryLimit=20
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    healthcheck:
      test: ["CMD", "nc", "-nz", "-w2", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./scripts:/scripts

  burritotest-gcs:
    image: fsouza/fake-gcs-server:1.56.1
    hostname: gcs    
    command:
      - -backend=memory
      - -host=0.0.0.0
      - -port-http=8000
      - -scheme=both
    ports:
      - "8000:8000"
      - "4443:4443"
    healthcheck: # allows the tests to wait for GCS to be ready
      test: ["CMD", "wget", "http://localhost:8000/_internal/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5

  burritotest-aws:
    image: localstack/localstack:4.14.0
    hostname: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - EDGE_PORT=4566
      - AWS_DEFAULT_REGION=eu-west-3
      - AWS_ACCESS_KEY_ID=burritoadmin
      - AWS_SECRET_ACCESS_KEY=burritoadminsecret
      - DEBUG=1
    healthcheck:
      test: "bash -c 'AWS_ACCESS_KEY_ID=burritoadmin AWS_SECRET_ACCESS_KEY=burritoadminsecret aws --endpoint-url=http://localhost:4566 s3 ls'"
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
