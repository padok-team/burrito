[tools]
# Language runtimes — pinned to the versions the repo declares for itself
go = "1.27.1"      # Dockerfile golang builder (>= go.mod 1.26.0)
node = "26.8.2"    # root package.json devEngines runtime
pnpm = "12.4.0"   # root package.json devEngines packageManager; ui/ downloads its own via devEngines

# Kubernetes & dev CLIs — pinned for a reproducible environment
kubectl = "1.37.0"      # aligns with ENVTEST_K8S_VERSION (1.36.0)
helm = "4.3.0"
kind = "0.33.0"
yq = "4.53.6"           # mikefarah
golangci-lint = "2.13.2"
helm-docs = "1.14.2"    # regenerates deploy/charts/burrito/README.md from values.yaml

# Docs toolchain
uv = "0.12.12"

# Not managed here (system-level): docker + buildx/compose, make, git.

[env]
# Automatic virtualenv activation for the docs toolchain
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install documentation dependencies"
run = "uv sync"

[tasks.docs-serve]
depends = "install"
description = "Serve Zensical documentation locally"
run = "uv run zensical serve"

[tasks.lint]
description = "Run golangci-lint (no make target exists for it)"
run = "golangci-lint run ./..."

[tasks."helm-docs"]
description = "Regenerate deploy/charts/burrito/README.md from values.yaml"
run = "helm-docs --chart-search-root=deploy/charts"
